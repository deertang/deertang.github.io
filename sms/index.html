    <script>
        const letterImages = {
            Tsuki: "/assets/sms/%E8%90%BD%E5%9C%B0%E9%A1%B5_Tsuki.webp",
            亮亮: "/assets/sms/%E8%90%BD%E5%9C%B0%E9%A1%B5_%E4%BA%AE%E4%BA%AE.webp",
            迈尔斯: "/assets/sms/%E8%90%BD%E5%9C%B0%E9%A1%B5_%E8%BF%88%E5%B0%94%E6%96%AF.webp",
            路易: "/assets/sms/%E8%90%BD%E5%9C%B0%E9%A1%B5_%E8%B7%AF%E6%98%93.webp",
            老师傅: "/assets/sms/%E8%90%BD%E5%9C%B0%E9%A1%B5_%E8%80%81%E5%B8%88%E5%82%85.webp",
            拉尔夫: "/assets/sms/%E8%90%BD%E5%9C%B0%E9%A1%B5_%E6%8B%89%E5%B0%94%E5%A4%AB.webp",
            主任: "/assets/sms/%E8%90%BD%E5%9C%B0%E9%A1%B5_%E4%B8%BB%E4%BB%BB.webp",
            kaka: "/assets/sms/%E8%90%BD%E5%9C%B0%E9%A1%B5_kaka.webp",
            茶茶: "/assets/sms/%E8%90%BD%E5%9C%B0%E9%A1%B5_%E8%8C%B6%E8%8C%B6.webp"
        };

        const UBA_APP_ID = 270;
        const UBA_PAGE_KEY = "cha_bai_dao_tinytype_collab_activity";
        const UBA_PAGE_MODULE = "cha_bai_dao_tinytype_collab_activity_page";
        const UBA_ENDPOINT = "https://spider-tracker.xiaohongshu.com/api/data";
        const UBA_BIZ_TYPE = "1663676682";
        const UBA_USER_KEY = "tinytype_sms_uid";

        function ubaUuid() {
            if (crypto.randomUUID) {
                return crypto.randomUUID();
            }
            return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
                const r = Math.random() * 16 | 0;
                const v = c === "x" ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function getUbaUserId() {
            try {
                const stored = localStorage.getItem(UBA_USER_KEY);
                if (stored) {
                    return stored;
                }
                const created = ubaUuid();
                localStorage.setItem(UBA_USER_KEY, created);
                return created;
            } catch (error) {
                return ubaUuid();
            }
        }

        function ubaPlatform() {
            const ua = navigator.userAgent || "";
            if (/iPhone|iPad|iPod/i.test(ua)) {
                return "iOSBrowser";
            }
            if (/Android/i.test(ua)) {
                return "AndroidBrowser";
            }
            if (/Mac OS X/i.test(ua)) {
                return "Mac";
            }
            if (/Windows/i.test(ua)) {
                return "Windows";
            }
            return "others";
        }

        const ubaState = {
            eventSeq: 0,
            sessionId: ubaUuid(),
            userId: getUbaUserId(),
            pageViewSent: false,
            pageViewAt: null,
            activeLetter: null
        };

        const letterUbaConfig = {
            "茶茶": {
                click: "cha_bai_dao_tinytype_collab_activity_receive_chacha_letter",
                impression: "cha_bai_dao_tinytype_collab_activity_chacha_letter",
                close: "cha_bai_dao_tinytype_collab_activity_chacha_letter_close_btn"
            },
            Tsuki: {
                click: "cha_bai_dao_tinytype_collab_activity_receive_tsuki_letter",
                impression: "cha_bai_dao_tinytype_collab_activity_tsuki_letter",
                close: "cha_bai_dao_tinytype_collab_activity_tsuki_letter_close_btn"
            },
            "亮亮": {
                click: "cha_bai_dao_tinytype_collab_activity_receive_liangliang_letter",
                impression: "cha_bai_dao_tinytype_collab_activity_liangliang_letter",
                close: "cha_bai_dao_tinytype_collab_activity_liangliang_letter_close_btn"
            },
            "迈尔斯": {
                click: "cha_bai_dao_tinytype_collab_activity_receive_miles_letter",
                impression: "cha_bai_dao_tinytype_collab_activity_miles_letter",
                close: "cha_bai_dao_tinytype_collab_activity_miles_letter_close_btn"
            },
            "路易": {
                click: "cha_bai_dao_tinytype_collab_activity_receive_louis_letter",
                impression: "cha_bai_dao_tinytype_collab_activity_louis_letter",
                close: "cha_bai_dao_tinytype_collab_activity_louis_letter_close_btn"
            },
            "老师傅": {
                click: "cha_bai_dao_tinytype_collab_activity_receive_master_letter",
                impression: "cha_bai_dao_tinytype_collab_activity_master_letter",
                close: "cha_bai_dao_tinytype_collab_activity_master_letter_close_btn"
            },
            "拉尔夫": {
                click: "cha_bai_dao_tinytype_collab_activity_receive_ralph_letter",
                impression: "cha_bai_dao_tinytype_collab_activity_ralph_letter",
                close: "cha_bai_dao_tinytype_collab_activity_ralph_letter_close_btn"
            },
            "主任": {
                click: "cha_bai_dao_tinytype_collab_activity_receive_director_letter",
                impression: "cha_bai_dao_tinytype_collab_activity_director_letter",
                close: "cha_bai_dao_tinytype_collab_activity_director_letter_close_btn"
            },
            kaka: {
                click: "cha_bai_dao_tinytype_collab_activity_receive_kaka_letter",
                impression: "cha_bai_dao_tinytype_collab_activity_kaka_letter",
                close: "cha_bai_dao_tinytype_collab_activity_kaka_letter_close_btn"
            }
        };

        const UBA_POINT_IDS = {
            "cha_bai_dao_tinytype_collab_activity_page:PAGE_VIEW": 117430,
            "cha_bai_dao_tinytype_collab_activity_page:PAGE_END": 117431,
            "cha_bai_dao_tinytype_collab_activity_android_download_btn:CLICK": 117432,
            "cha_bai_dao_tinytype_collab_activity_ios_download_btn:CLICK": 117433,
            "cha_bai_dao_tinytype_collab_activity_receive_kaka_letter:CLICK": 117434,
            "cha_bai_dao_tinytype_collab_activity_receive_director_letter:CLICK": 117435,
            "cha_bai_dao_tinytype_collab_activity_follow_btn:CLICK": 117436,
            "cha_bai_dao_tinytype_collab_activity_receive_chacha_letter:CLICK": 117437,
            "cha_bai_dao_tinytype_collab_activity_receive_milk_tea_benefit_btn:CLICK": 117438,
            "cha_bai_dao_tinytype_collab_activity_receive_tsuki_letter:CLICK": 117439,
            "cha_bai_dao_tinytype_collab_activity_receive_liangliang_letter:CLICK": 117440,
            "cha_bai_dao_tinytype_collab_activity_receive_miles_letter:CLICK": 117441,
            "cha_bai_dao_tinytype_collab_activity_receive_louis_letter:CLICK": 117442,
            "cha_bai_dao_tinytype_collab_activity_receive_master_letter:CLICK": 117443,
            "cha_bai_dao_tinytype_collab_activity_receive_ralph_letter:CLICK": 117444,
            "cha_bai_dao_tinytype_collab_activity_chacha_letter:IMPRESSION": 117463,
            "cha_bai_dao_tinytype_collab_activity_chacha_letter_close_btn:CLICK": 117464,
            "cha_bai_dao_tinytype_collab_activity_ralph_letter:IMPRESSION": 117465,
            "cha_bai_dao_tinytype_collab_activity_ralph_letter_close_btn:CLICK": 117466,
            "cha_bai_dao_tinytype_collab_activity_master_letter:IMPRESSION": 117467,
            "cha_bai_dao_tinytype_collab_activity_master_letter_close_btn:CLICK": 117468,
            "cha_bai_dao_tinytype_collab_activity_liangliang_letter:IMPRESSION": 117469,
            "cha_bai_dao_tinytype_collab_activity_liangliang_letter_close_btn:CLICK": 117470,
            "cha_bai_dao_tinytype_collab_activity_louis_letter:IMPRESSION": 117471,
            "cha_bai_dao_tinytype_collab_activity_louis_letter_close_btn:CLICK": 117472,
            "cha_bai_dao_tinytype_collab_activity_miles_letter:IMPRESSION": 117473,
            "cha_bai_dao_tinytype_collab_activity_miles_letter_close_btn:CLICK": 117474,
            "cha_bai_dao_tinytype_collab_activity_director_letter:IMPRESSION": 117475,
            "cha_bai_dao_tinytype_collab_activity_director_letter_close_btn:CLICK": 117476,
            "cha_bai_dao_tinytype_collab_activity_kaka_letter:IMPRESSION": 117477,
            "cha_bai_dao_tinytype_collab_activity_kaka_letter_close_btn:CLICK": 117478,
            "cha_bai_dao_tinytype_collab_activity_tsuki_letter:IMPRESSION": 117479,
            "cha_bai_dao_tinytype_collab_activity_tsuki_letter_close_btn:CLICK": 117480
        };

        function sendUbaEvent(moduleKey, action, attributes) {
            ubaState.eventSeq += 1;
            const pointId = UBA_POINT_IDS[`${moduleKey}:${action}`];
            const eventInfo = {
                page_key: UBA_PAGE_KEY,
                module_key: moduleKey,
                action: action,
                event_seq: ubaState.eventSeq,
                event_time: Date.now(),
                event_id: ubaUuid(),
                url: window.location.href
            };
            if (pointId) {
                eventInfo.point_id = pointId;
            }
            if (attributes && Object.keys(attributes).length) {
                eventInfo.attributes = attributes;
            }
            const payload = {
                context: {
                    app_id: UBA_APP_ID,
                    session_id: ubaState.sessionId,
                    platform: ubaPlatform(),
                    user_agent: navigator.userAgent || "",
                    artifact_name: "tinytype-sms",
                    artifact_version: "1.0.0",
                    user_id: ubaState.userId,
                    group_user_id: "",
                    container_artifact_name: "",
                    container_artifact_version: ""
                },
                event_info: eventInfo
            };
            const body = JSON.stringify(payload);
            return fetch(UBA_ENDPOINT, {
                method: "POST",
                headers: {
                    accept: "application/json, text/plain, */*",
                    "content-type": "text/plain",
                    "Biz-Type": UBA_BIZ_TYPE
                },
                body: body,
                keepalive: true,
                mode: "cors"
            }).catch(() => {});
        }

        function sendUbaPageView() {
            if (ubaState.pageViewSent) {
                return;
            }
            ubaState.pageViewSent = true;
            ubaState.pageViewAt = Date.now();
            sendUbaEvent(UBA_PAGE_MODULE, "PAGE_VIEW");
        }

        function sendUbaPageEnd() {
            if (!ubaState.pageViewSent || !ubaState.pageViewAt) {
                return;
            }
            sendUbaEvent(UBA_PAGE_MODULE, "PAGE_END", {
                duration: Math.max(0, Date.now() - ubaState.pageViewAt)
            });
        }

        const modal = document.getElementById("letter-modal");
        const letterImage = document.getElementById("letter-image");
        const closeButton = document.getElementById("letter-close");
        const landingImage = document.querySelector(".landing-image");
        let lastTrigger = null;

        function openLetter(animal, trigger) {
            const config = letterUbaConfig[animal];
            if (config) {
                sendUbaEvent(config.click, "CLICK");
            }
            letterImage.src = letterImages[animal];
            letterImage.alt = `${animal} 写给你的来信`;
            modal.classList.add("open");
            document.body.classList.add("modal-open");
            lastTrigger = trigger;
            ubaState.activeLetter = animal;
            closeButton.focus();
            if (config) {
                sendUbaEvent(config.impression, "IMPRESSION");
            }
        }

        function closeLetter(fromCloseButton) {
            if (fromCloseButton && ubaState.activeLetter) {
                const config = letterUbaConfig[ubaState.activeLetter];
                if (config) {
                    sendUbaEvent(config.close, "CLICK");
                }
            }
            modal.classList.remove("open");
            document.body.classList.remove("modal-open");
            letterImage.removeAttribute("src");
            ubaState.activeLetter = null;
            if (lastTrigger) {
                lastTrigger.focus();
            }
        }

        document.querySelectorAll("[data-letter]").forEach((button) => {
            button.addEventListener("click", () => openLetter(button.dataset.letter, button));
        });

        document.querySelectorAll("[data-uba-module]").forEach((element) => {
            element.addEventListener("click", (event) => {
                const href = element.getAttribute("href");
                const isExternalLink = element.tagName === "A" && href && href !== "#";
                if (isExternalLink) {
                    event.preventDefault();
                    const navigate = () => {
                        window.location.href = href;
                    };
                    const timer = window.setTimeout(navigate, 400);
                    Promise.resolve(sendUbaEvent(element.dataset.ubaModule, element.dataset.ubaAction || "CLICK")).finally(() => {
                        window.clearTimeout(timer);
                        navigate();
                    });
                    return;
                }
                sendUbaEvent(element.dataset.ubaModule, element.dataset.ubaAction || "CLICK");
            });
        });

        closeButton.addEventListener("click", () => closeLetter(true));
        modal.addEventListener("click", (event) => {
            if (event.target === modal) {
                closeLetter(false);
            }
        });
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && modal.classList.contains("open")) {
                closeLetter(false);
            }
        });

        window.addEventListener("pagehide", sendUbaPageEnd);
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "hidden") {
                sendUbaPageEnd();
            }
        });

        function startUbaPageView() {
            sendUbaPageView();
        }

        if (landingImage) {
            if (landingImage.complete) {
                startUbaPageView();
            } else {
                landingImage.addEventListener("load", startUbaPageView, { once: true });
                landingImage.addEventListener("error", startUbaPageView, { once: true });
            }
        } else {
            startUbaPageView();
        }

        function preloadLetters() {
            Object.values(letterImages).forEach((src) => {
                const image = new Image();
                image.fetchPriority = "low";
                image.src = src;
            });
        }

        if ("requestIdleCallback" in window) {
            requestIdleCallback(preloadLetters, { timeout: 1000 });
        } else {
            setTimeout(preloadLetters, 500);
        }
    </script>
</body>
</html>
